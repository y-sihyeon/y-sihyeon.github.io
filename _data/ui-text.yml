# 화면 문구 (Minimal Mistakes 테마 4.28.1 의 _data/ui-text.yml 중 한국어 부분)
#
# 테마 안에도 같은 파일이 있지만, GitHub Pages 가 쓰는 Jekyll 3.10 은 테마의 _data
# 폴더를 읽지 못합니다(테마 _data 지원은 Jekyll 4 부터). 그래서 이 파일이 없으면
# 사이트 locale 이 ko-KR 이어도 "less than 1 minute read", "Share on" 같은 영어 기본
# 문구가 나옵니다. 저장소의 _data 는 Jekyll 3 에서도 읽히므로 여기에 둡니다.
#
# 원본에서 비어 있던 항목(건너뛰기 링크, 검색 안내)은 영어로 대신 나오던 것이라
# 한국어로 채웠습니다. meta_label 은 비어 있어야 제목이 붙지 않으므로 그대로 둡니다.

